# Build settings
future: false

theme: minima

include: ["_pages"]
permalink: "/:title"

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-postcss

cover_image: "/assets/img/bg/page-title.jpg"

defaults:
  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      header_img: "/assets/images/og-image.jpg"
      image: "/assets/images/og-image.jpg"

  # drafts
  - scope:
      path: "_drafts"
    values:
      layout: post
      header_img: "/assets/images/og-image.jpg"
      image: "/assets/images/og-image.jpg"

  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page
      header_img: "/assets/images/og-image.jpg"
      image: "/assets/images/og-image.jpg"

  # all pages
  - scope:
      path: "_landing_pages"
    values:
      layout: page
      header_img: "/assets/images/og-image.jpg"
      image: "/assets/images/og-image.jpg"

  # all pages
  - scope:
      path: ""
    values:
      layout: page
      header_img: "/assets/images/og-image.jpg"
      image: "/assets/images/og-image.jpg"

collections:
  services:
    output: false
  landing_pages:
    output: false

paginate: 6
paginate_path: "/blog/page:num/"

feed:
  collections:
    posts:
      path: "/index.xml"
