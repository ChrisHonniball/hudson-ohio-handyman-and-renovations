---
layout: default
---

{% unless page.disable_header %}
  <section class="hero-area" id="home">
    <div class="bg-cover w-100 h-100"
      style="background-image: url('{{page.header_img}}');"
    >
      <div class="bg-primary bg-opacity-75 bg-blur w-100 h-100">
        <div class="container hero-area-content w-100 h-100 d-flex justify-content-start align-items-center">
          <h1 class="display-4 fw-bold col-12 col-lg-9 col-xl-7 text-white">
            {{page.title}}
          </h1>
        </div>
      </div>
    </div>
  </section>
{% endunless %}

<!--======  blog-details PART START ======-->
<section class="blog-details pt-40 pb-0">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 px-5">
        <div class="single-blog-details-box">
          <div class="post-content pb-70">
            {{page.content}}
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="sidebar">
          {% include sidebar.html %}
        </div>
      </div>
    </div>
  </div>
</section>
<!--======  blog-details PART end ======-->
