---
layout: default
---

{% unless page.disable_header %}
<section class="w-full">
  <div
    class="bg-cover w-full h-[300px]"
    style="background-image: url('{{page.header_img}}');"
  >
    <div class="bg-brand-blue/75 backdrop-blur-xs w-full h-full">
      <div
        class="max-w-[1320px] mx-auto px-3 md:px-0 flex flex-col h-full justify-center items-start"
      >
        <h1 class="text-[56px] text-bold mt-0 mb-2 text-white drop-shadow-lg">
          {{page.title}}
        </h1>
      </div>
    </div>
  </div>
</section>
{% endunless %}

<div class="post-content">{{content}}</div>
