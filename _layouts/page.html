---
layout: default
---

{% unless page.disable_header %}
  <section class="hero-area" id="home">
    <div class="bg-cover w-100 h-100"
      style="background-image: url('{{page.header_img}}');"
    >
      <div class="bg-primary bg-opacity-75 bg-blur w-100 h-100">
        <div class="container hero-area-content w-100 h-100 d-flex justify-content-start align-items-center">
          <h1 class="display-4 fw-bold col-12 col-lg-9 col-xl-7 text-white">
            {{page.title}}
          </h1>
        </div>
      </div>
    </div>
  </section>
{% endunless %}

<div class="post-content">
  {{page.content}}
</div>
