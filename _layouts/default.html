<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    >

    <title>
      {% if page.title %}{{ page.title }} | {% endif %}
      {{ site.title }}
    </title>

    {% seo title=false %}

    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="/assets/images/favicon.png"
    >

    <link
      rel="stylesheet"
      href="{{relative_url}}/assets/tailwind.css?t={{ site.time | date: '%Y%m%d%H%M%S' }}"
    >

    <link rel="stylesheet" href="/assets/fontawesome-all-v5.15.1.css">

    {% if jekyll.environment != 'development' %}
      {% include analytics.html %}
    {% endif %}
  </head>
  <body>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
  </body>
</html>
