---
layout: default
title: "Blog"
pagination:
  enabled: true
---


{% assign post_count = paginator.posts | size %}
{% if post_count > 0 %}
  <section class="pt-80 pb-0">
    <div class="text-center">
      <h4 class="lead m-0">Latest</h4>
      <h1 class="display-4 mt-n2 mb-50">Articles</h1>
    </div>
  </section>

  {% include blog.html posts=paginator.posts %}

  <div class="row pt-40 pb-40">
    <div class="col-lg-12">
      {% include pagination.html %}
    </div>
  </div>
{% else %}
  <section class="pt-40 pb-40">
    <div class="container">
      <div class="row d-flex justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          {% include subscribe/small-business.html %}
        </div>
      </div>
    </div>
  </section>
{% endif %}
