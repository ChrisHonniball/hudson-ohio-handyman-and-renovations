<div class="d-flex flex-wrap justify-content-center">
  {% if site.linkedin_url %}
    <a style="width: 45px; height: 45px;" class="position-relative m-2 rounded-circle bg-white text-primary" href="{{site.linkedin_url}}" target="__blank" title="Follow on LinkedIn">
      <i class="position-absolute top-0 start-50 top-50 translate-middle fab fa-linkedin"></i>
    </a>
  {% endif %}
  {% if site.facebook_url %}
    <a style="width: 45px; height: 45px;" class="position-relative m-2 rounded-circle bg-white text-primary" href="{{site.facebook_url}}" target="__blank" title="Follow on Facebook">
      <i class="position-absolute top-0 start-50 top-50 translate-middle fab fa-facebook-f"></i>
    </a>
  {% endif %}
  {% if site.instagram_url %}
    <a style="width: 45px; height: 45px;" class="position-relative m-2 rounded-circle bg-white text-primary" href="{{site.instagram_url}}" target="__blank" title="Follow on Instagram">
      <i class="position-absolute top-0 start-50 top-50 translate-middle fab fa-instagram"></i>
    </a>
  {% endif %}
  {% if site.twitter_url %}
    <a style="width: 45px; height: 45px;" class="position-relative m-2 rounded-circle bg-white text-primary" href="{{site.twitter_url}}" target="__blank" title="Follow on Twitter">
      <i class="position-absolute top-0 start-50 top-50 translate-middle fab fa-twitter"></i>
    </a>
  {% endif %}
  {% if site.youtube_url %}
    <a style="width: 45px; height: 45px;" class="position-relative m-2 rounded-circle bg-white text-primary" href="{{site.youtube_url}}" target="__blank" title="Watch on YouTube">
      <i class="position-absolute top-0 start-50 top-50 translate-middle fab fa-youtube"></i>
    </a>
  {% endif %}
</div>
