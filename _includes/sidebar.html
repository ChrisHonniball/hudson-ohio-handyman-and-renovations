<div class="recent-news-area d-flex flex-column pb-4">
  <h5 class="text-info border-bottom pb-3 mb-3">Recent Articles</h5>

  {% for post in site.posts limit: 5 %}
    <div class="ps-3 mb-4">
      <div class="news-box-content">
        <h5 class="m-0">
          <a href="{{post.url}}" class="text-dark text-decoration-none">{{post.title | truncate: 66}}</a>
        </h5>
        <div class="small text-muted">{{post.date | date_to_string}}</div>
      </div>
    </div>
  {% endfor %}
</div>

{% if page.sidebar_cta %}
  {% include {{page.sidebar_cta}} %}
{% endif %}

{% if page.sidebar_subscribe %}
  {% include {{page.sidebar_subscribe}} %}
{% endif %}
