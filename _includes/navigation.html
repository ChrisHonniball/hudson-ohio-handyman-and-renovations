<div id="main-nav" class="collapse navbar-collapse">
  <ul class="navbar-nav ms-auto">
    <li class="nav-item">
      <a class="nav-link {% if page.url == '/' %}active{% endif %}" href="{{site.url}}/">Home</a>
    </li>

    <li class="nav-item">
      <a class="nav-link {% if page.url == '/blog/' %}active{% endif %}" href="{{site.url}}/blog/">Blog</a>
    </li>

    <li class="nav-item dropdown">
      <a class="nav-link dropdown-toggle {% if page.url contains 'services' %}active{% endif %}" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        Services
      </a>
      <ul class="dropdown-menu dropdown-menu-end">
        {% for service in site.services %}
          <li>
            <a class="dropdown-item {% if page.url contains service.url %}active{% endif %}" href="{{site.url}}{{service.url}}">
              {% if service.navicon %}<i class="fas fa-fw {{service.navicon}} pe-3 {% if page.url contains service.url %}text-white{% else %}text-info{% endif %}"></i>{% endif %}
              {% if service.navicon %}
                {{service.navtext}}
              {% else %}
                {{service.title}}
              {% endif %}
            </a>
          </li>
        {% endfor %}
      </ul>
    </li>

    <li class="nav-item">
      <a class="nav-link" href="#Contact">Contact</a>
    </li>
  </ul>
</div>
